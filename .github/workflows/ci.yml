name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv run pytest
      - run: uv run main.py
      - run: uv run score.py artifacts/*.pkl data/k8s_checkout_metrics.csv data/shadow_predictions.csv --as-of 2026-10-31T00:00:00Z
      - run: uv run benchmark.py --seeds 2
